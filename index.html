<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>Happy Birthday, [NAME]!</h1>
    <p class="tagline">A little surprise is waiting for you...</p>
  </header>

  <main>
    <section id="dogs" class="panel">
      <h2>Dog Appreciation Corner</h2>
      <figure>
        <img src="images/dog.jpg" alt="Dog">
        <figcaption>[Dog caption]</figcaption>
      </figure>
    </section>

    <section id="game" class="panel">
      <h2>Play to unlock your gift</h2>
      <!-- Phase 3: Unity WebGL build will be embedded here, e.g. <iframe src="game/index.html"> -->
      <div class="game-placeholder">Game coming soon</div>
      <button id="fake-victory" type="button" class="debug">Debug: fake victory</button>
    </section>

    <!-- The gift: the retro card is revealed after winning the game -->
    <section id="surprise" class="panel retro-card" hidden>
      <h2>&#9733; Happy Birthday! &#9733;</h2>
      <p>[Your birthday message goes here]</p>
      <figure>
        <img src="images/her-photo.jpg" alt="Her funny photo">
        <figcaption>[Funny photo caption]</figcaption>
      </figure>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
