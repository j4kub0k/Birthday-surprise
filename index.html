<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Movie Night Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <p class="kicker">// MOVIE.NIGHT_v1</p>
    <div class="hero-title">
      <span class="star" aria-hidden="true">&#10022;</span>
      <h1 class="wordart" data-sparkle>Movie Night</h1>
      <span class="star" aria-hidden="true">&#10022;</span>
    </div>
    <p class="tagline">Pick a movie. Pick a day. Press play.</p>
  </header>

  <main>
    <section id="movies" class="panel" data-label="01 // PLANNER">
      <div class="planner">
        <div class="planner-col">
          <h2>Movies to watch</h2>
          <ul id="movie-list" class="planner-list"><li class="muted">Loading...</li></ul>
          <a id="add-movie" class="button" href="#" target="_blank" rel="noopener">+ Add a movie</a>
        </div>
        <div class="planner-col">
          <h2>Dates we're free</h2>
          <ul id="date-list" class="planner-list"><li class="muted">Loading...</li></ul>
          <a id="add-date" class="button" href="#" target="_blank" rel="noopener">+ Add a free date</a>
        </div>
      </div>
    </section>

    <section id="dogs" class="panel" data-label="02 // PHOTOS">
      <details>
        <summary><h2>In case you'll miss your love</h2></summary>
        <!-- Photos dog1.jpg ... dog7.jpg are placed here in random order by planner.js -->
        <div id="dog-gallery" class="dog-gallery"></div>
      </details>
    </section>
  </main>

  <footer class="hazard" aria-hidden="true"><span>&gt; SEE YOU AT THE MOVIES_</span></footer>

  <script src="config.js"></script>
  <script src="planner.js"></script>
</body>
</html>
